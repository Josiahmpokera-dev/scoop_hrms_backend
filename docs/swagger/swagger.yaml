        minLength: 3
        type: string
    required:
    - employee_id
    - password
    - role
    type: object
  models.EmployeeAttendanceStats:
    properties:
      absent_days:
        type: integer
      average_working_hours:
        type: number
      early_departure_days:
        type: integer
      late_days:
        type: integer
      present_days:
        type: integer
      present_percentage:
        type: number
      total_working_days:
        type: integer
      total_working_hours:
        type: number
    type: object
  models.EmployeeComplianceStats:
    properties:
      violations:
        items:
          $ref: '#/definitions/models.ComplianceViolationDetail'
        type: array
      violations_count:
        type: integer
    type: object
  models.EmployeeLeaveStats:
    properties:
      approved_requests:
        type: integer
      leave_breakdown:
        items:
          $ref: '#/definitions/models.LeaveTypeBreakdown'
        type: array
      pending_requests:
        type: integer
      rejected_requests:
        type: integer
      total_leave_days:
        type: integer
    type: object
  models.EmployeeOvertimeStats:
    properties:
      approved_hours:
        type: number
      comp_off_hours:
        type: number
      pending_hours:
        type: number
      rejected_hours:
        type: number
      total_payout:
        type: number
      total_requests:
        type: integer
    type: object
  models.EmployeeReportPeriod:
    properties:
      end_date:
        type: string
      start_date:
        type: string
    type: object
  models.EmployeeTimesheetStats:
    properties:
      billable_hours:
        type: number
      non_billable_hours:
        type: number
      overtime_hours:
        type: number
      regular_hours:
        type: number
      total_hours:
        type: number
    type: object
  models.GetDraftEmployeeRequest:
    properties:
      employee_id:
        description: Employee ID (e.g., "EMP001")
        type: string
    required:
    - employee_id
    type: object
  models.InitiateSeparationRequest:
    properties:
      additional_notes:
        type: string
      employee_id:
        type: string
      exit_interview_required:
        type: boolean
      initiated_by:
        description: Employee ID of person initiating
        type: string
      last_working_date:
        description: ISO 8601 format
        type: string
      notice_period_days:
        minimum: 1
        type: integer
      reason:
        type: string
      reason_code:
        description: Better Opportunity, Higher Studies, etc.
        type: string
      resignation_date:
        description: ISO 8601 format
        type: string
      separation_type:
        enum:
        - Resignation
        - Termination
        - Retirement
        - Mutual Separation
        - End of Contract
        - Layoff
        type: string
    required:
    - employee_id
    - last_working_date
    - notice_period_days
    - reason
    - resignation_date
    - separation_type
    type: object
  models.LeaveTypeBreakdown:
    properties:
      days:
        type: number
      leave_type:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  models.ManualPunch:
    properties:
      approved_at:
        type: string
      approver_id:
        description: References employees(id) - who approved/rejected
        type: integer
      approver_name:
        type: string
      created_at:
        description: Timestamps
        type: string
      employee_id:
        description: References employees(id)
        type: integer
      employee_name:
        description: Virtual fields (not stored in database)
        type: string
      id:
        type: integer
      punch_date:
        description: Date of the punch
        type: string
      punch_time:
        description: Actual time of punch
        type: string
      punch_type:
        allOf:
        - $ref: '#/definitions/models.ManualPunchType'
        description: in or out
      reason:
        description: Reason for manual punch
        type: string
      rejection_reason:
        description: Reason for rejection if applicable
        type: string
      status:
        $ref: '#/definitions/models.ManualPunchStatus'
      supporting_document:
        description: Optional document URL
        type: string
      updated_at:
        type: string
    type: object
  models.ManualPunchApprovalRequest:
    properties:
      rejection_reason:
        description: Required if status is rejected
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.ManualPunchStatus'
        enum:
        - approved
        - rejected
    required:
    - status
    type: object
  models.ManualPunchRequest:
    properties:
      punch_type:
        allOf:
        - $ref: '#/definitions/models.ManualPunchType'
        enum:
        - in
        - out
