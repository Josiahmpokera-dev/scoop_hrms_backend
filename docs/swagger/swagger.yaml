basePath: /api/v1
definitions:
  handlers.UpdateRolePermissionsReq:
    properties:
      permissions:
        items:
          type: string
        type: array
    required:
    - permissions
    type: object
  models.AddMemberEntry:
    properties:
      employee_id:
        type: string
      role:
        $ref: '#/definitions/models.MemberRole'
    required:
    - employee_id
    type: object
  models.AddMembersRequest:
    properties:
      members:
        items:
          $ref: '#/definitions/models.AddMemberEntry'
        minItems: 1
        type: array
    required:
    - members
    type: object
  models.AddRoleRequest:
    properties:
      role:
        description: Role to add
        enum:
        - super_admin
        - admin
        - hr
        - it
        - manager
        - employee
        - user
        type: string
      user_id:
        description: User to add role to
        type: integer
    required:
    - role
    - user_id
    type: object
  models.ApproveSettlementRequest:
    properties:
      approval_notes:
        type: string
      approved_by_id:
        description: Employee ID
        type: string
    required:
    - approved_by_id
    type: object
  models.AssignProjectRequest:
    properties:
      employee_ids:
        description: One or more employee IDs
        items:
          type: string
        minItems: 1
        type: array
      project_id:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/models.MemberRole'
        description: 'Role for all (default: member)'
    required:
    - employee_ids
    - project_id
    type: object
  models.AssignRoleRequest:
    properties:
      position_id:
        description: 'Optional: set employee''s job position'
        type: integer
      role:
        description: Role to assign
        enum:
        - super_admin
        - admin
        - hr
        - it
        - manager
        - employee
        type: string
      user_id:
        description: User to assign role to
        type: integer
    required:
    - role
    - user_id
    type: object
  models.CalculateSettlementRequest:
    properties:
      advances:
        type: number
      asset_damages:
        type: number
      bonus:
        type: number
      currency:
        description: 'Default: TZS'
        type: string
      incentives:
        type: number
      leave_encashment:
        type: number
      notes:
        type: string
      other_deductions:
        type: number
      other_earnings:
        type: number
      outstanding_loans:
        type: number
      outstanding_salary:
        description: |-
          Optional: Can be calculated automatically based on employee data
          Or can provide custom values
        type: number
      tax_deductions:
        type: number
    type: object
  models.CancelExitInterviewRequest:
    properties:
      cancellation_reason:
        type: string
      cancelled_by_id:
        description: Employee ID
        type: string
    required:
    - cancellation_reason
    - cancelled_by_id
    type: object
  models.ChangeRolesRequest:
    properties:
      roles:
        description: Desired roles (checked items), e.g. ["employee", "manager", "hr"]
        items:
          type: string
        type: array
      user_id:
        description: Target user ID
        type: integer
    required:
    - roles
    - user_id
    type: object
  models.CompleteExitInterviewRequest:
    properties:
      conducted_by_id:
        description: Employee ID
        type: string
      feedback_rating:
        maximum: 5
        minimum: 1
        type: integer
      interview_notes:
        type: string
      would_recommend:
        type: boolean
    required:
    - conducted_by_id
    - interview_notes
    type: object
  models.CompleteOffboardingRequest:
    properties:
      completed_by_id:
        description: Employee ID
        type: string
    type: object
  models.CompleteOnboardingRequest:
    properties:
      draft_id:
        description: Draft ID to complete
        type: integer
    required:
    - draft_id
    type: object
  models.ComplianceViolationDetail:
    properties:
      date:
        type: string
      details:
        type: string
      severity:
        type: string
      type:
        type: string
    type: object
  models.ComprehensiveEmployeeReportResponse:
    properties:
      attendance:
        $ref: '#/definitions/models.EmployeeAttendanceStats'
      compliance:
        $ref: '#/definitions/models.EmployeeComplianceStats'
      department:
        type: string
      employee_id:
        type: string
      employee_name:
        type: string
      leave:
        $ref: '#/definitions/models.EmployeeLeaveStats'
      overtime:
        $ref: '#/definitions/models.EmployeeOvertimeStats'
      period:
        $ref: '#/definitions/models.EmployeeReportPeriod'
      position:
        type: string
      timesheet:
        $ref: '#/definitions/models.EmployeeTimesheetStats'
    type: object
  models.CreateDailyTaskRequest:
    properties:
      category:
        $ref: '#/definitions/models.TaskCategory'
      description:
        type: string
      hours_spent:
        maximum: 24
        type: number
      notes:
        type: string
      progress_contribution:
        description: 0-100
        type: number
      project_id:
        type: integer
      status:
        $ref: '#/definitions/models.TaskStatus'
      tags:
        type: string
      task_date:
        description: YYYY-MM-DD, defaults to today
        type: string
      title:
        maxLength: 300
        minLength: 2
        type: string
    required:
    - category
    - hours_spent
    - project_id
    - title
    type: object
  models.CreateDraftRequest:
    properties:
      data:
        additionalProperties: true
        description: 'Optional: Step data (requires step number)'
        type: object
      existing_user_email:
        description: 'Optional: Onboard user with this email (no credentials at end)'
        type: string
      linked_user_id:
        description: 'Optional: Onboard this existing user (no credentials at end)'
        type: integer
      step:
        description: 'Optional: Step number (1-10) if providing step data'
        type: integer
      step1_data:
        additionalProperties: true
        description: 'Optional: Step 1 data to save immediately (legacy)'
        type: object
    type: object
  models.CreateProjectRequest:
    properties:
      budget:
        type: number
      category:
        type: string
      department_id:
        type: integer
      description:
        type: string
      due_date:
        description: YYYY-MM-DD or ISO 8601
        type: string
      end_date:
        description: YYYY-MM-DD or ISO 8601
        type: string
      estimated_hours:
        type: number
      member_ids:
        description: Employee IDs to assign initially
        items:
          type: string
        type: array
      name:
        maxLength: 200
        minLength: 2
        type: string
      notes:
        type: string
      priority:
        $ref: '#/definitions/models.ProjectPriority'
      start_date:
        description: YYYY-MM-DD or ISO 8601
        type: string
    required:
    - name
    type: object
  models.CreateUserRequest:
    properties:
      employee_id:
        description: ID of the existing employee to create a user for
        type: integer
      password:
        description: Login password (minimum 6 characters)
        minLength: 6
        type: string
      role:
        description: 'Role to assign: admin, hr, it, manager, employee, or user'
        enum:
        - admin
        - hr
        - it
        - manager
        - employee
        - user
        type: string
      username:
        description: Optional username (auto-generated from employee email if not
