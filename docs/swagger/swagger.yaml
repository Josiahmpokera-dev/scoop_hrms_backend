        type: string
    required:
    - interview_date
    - interviewer_id
    type: object
  models.SetRolesRequest:
    properties:
      roles:
        description: New roles array (e.g. ["admin", "employee"])
        items:
          type: string
        type: array
      user_id:
        description: User to set roles for
        type: integer
    required:
    - roles
    - user_id
    type: object
  models.TaskCategory:
    enum:
    - development
    - testing
    - design
    - documentation
    - meeting
    - research
    - planning
    - review
    - support
    - other
    type: string
    x-enum-varnames:
    - TaskCategoryDevelopment
    - TaskCategoryTesting
    - TaskCategoryDesign
    - TaskCategoryDocumentation
    - TaskCategoryMeeting
    - TaskCategoryResearch
    - TaskCategoryPlanning
    - TaskCategoryReview
