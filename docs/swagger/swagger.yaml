    - refresh_token
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        minLength: 2
        type: string
      last_name:
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
      role:
        description: Optional, defaults to "user"
        type: string
      username:
        description: Optional, will be generated from email if not provided
