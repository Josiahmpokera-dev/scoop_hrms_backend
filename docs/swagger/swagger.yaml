        maxLength: 500
        minLength: 10
        type: string
      supporting_document:
        type: string
    required:
    - punch_type
    - reason
    type: object
  models.ManualPunchStatus:
    enum:
    - pending
    - approved
    - rejected
    - cancelled
    type: string
    x-enum-varnames:
    - ManualPunchStatusPending
    - ManualPunchStatusApproved
    - ManualPunchStatusRejected
    - ManualPunchStatusCancelled
  models.ManualPunchType:
    enum:
    - in
    - out
    type: string
    x-enum-varnames:
    - ManualPunchTypeIn
    - ManualPunchTypeOut
  models.MemberRole:
    enum:
    - lead
    - member
    - reviewer
    type: string
    x-enum-varnames:
    - MemberRoleLead
    - MemberRoleMember
    - MemberRoleReviewer
  models.OnboardEmployeeRequest:
    properties:
      address:
