      first_name:
        minLength: 2
        type: string
      gender:
        type: string
      hire_date:
        type: string
      last_name:
        minLength: 2
        type: string
      location_id:
        type: integer
      notes:
        description: Additional
        type: string
      phone:
        type: string
      position_id:
        type: integer
      postal_code:
        type: string
      salary:
        description: Salary
        type: number
      state:
        type: string
