version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: always
    environment:
      POSTGRES_DB: scoop_db_v001
      POSTGRES_USER: scoop_hrm
      POSTGRES_PASSWORD: ScoopHRM@2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hrms-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hrms-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: scoop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hrms-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres  # This will resolve to postgres container IP
      DB_PORT: 5432
      DB_NAME: scoop_db_v001
      DB_USER: scoop_hrm
      DB_PASSWORD: ScoopHRM@2024!
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - hrms-network

networks:
  hrms-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data: