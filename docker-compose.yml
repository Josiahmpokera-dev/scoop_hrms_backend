services:
  # HRMS Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Server Configuration
      PORT: 8080
      ENV: ${ENV:-development}
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-hrms_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production_min_32_chars}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,PATCH,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      # File Storage Configuration
      STORAGE_PATH: /app/storage
      STORAGE_URL: /storage
      # RabbitMQ Configuration
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-biotime_exchange}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-biotime_transactions}
      RABBITMQ_PROCESSING_INTERVAL: ${RABBITMQ_PROCESSING_INTERVAL:-0}
      RABBITMQ_BATCH_SIZE: ${RABBITMQ_BATCH_SIZE:-0}
      # BioTime Configuration (optional)
      BIOTIME_BASE_URL: ${BIOTIME_BASE_URL:-}
      BIOTIME_USERNAME: ${BIOTIME_USERNAME:-}
      BIOTIME_PASSWORD: ${BIOTIME_PASSWORD:-}
      BIOTIME_ENABLED: ${BIOTIME_ENABLED:-false}
    volumes:
      - hrms-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hrms_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hrms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hrms-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# Named volumes for data persistence
volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  hrms-storage:
    driver: local

# Network configuration
networks:
  hrms-network:
    driver: bridge
